name: "🐛 Bug Report"
description: "Create a report to help us improve Adulting"
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., When I set a bill frequency to 'Biweekly', the second occurrence in the month is not displayed..."
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to 'Bills' tab
        2. Tap on '+ Add Bill'
        3. Enter amount and select Biweekly frequency
        4. Return to 'Planner' tab
        5. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: dropdown
    id: android_version
    attributes:
      label: Android Version
      description: What version of Android is your device running?
      options:
        - "Android 16 (API 36)"
        - "Android 15 (API 35)"
        - "Android 14 (API 34)"
        - "Android 13 (API 33)"
        - "Android 12 / 12L (API 31/32)"
        - "Android 11 (API 30)"
        - "Android 10 (API 29)"
        - "Android 9 or older (API 24-28)"
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: Device Model
      description: Device manufacturer and model (e.g. Google Pixel 8, Samsung Galaxy S24, Emulator).
    validations:
      required: false
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any crash logcat output or drag and drop screenshots here.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Self-Check
      options:
        - label: I have verified this bug is not already reported in existing issues.
          required: true
        - label: I am using the latest release or main branch.
          required: true
