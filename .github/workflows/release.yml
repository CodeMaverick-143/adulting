name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"
      release_title:
        description: "Release Title"
        required: false
        default: "Adulting Release"

permissions:
  contents: write

jobs:
  release:
    name: Build AAB & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          elif [ ! -f release.keystore ]; then
            echo "Generating release keystore for CI signing..."
            keytool -genkey -v -keystore release.keystore -alias adulting -keyalg RSA -keysize 2048 -validity 10000 -storepass adulting123 -keypass adulting123 -dname "CN=Adulting, OU=Adulting, O=Adulting, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android App Bundle (AAB) & Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'adulting123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'adulting' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'adulting123' }}
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          # Rename artifacts with clean semantic filenames
          mkdir -p release_dist
          cp app/build/outputs/bundle/release/app-release.aab "release_dist/adulting-${TAG}.aab"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_dist/adulting-${TAG}.apk"
          fi

          ls -lh release_dist/

      - name: Create GitHub Release & Upload AAB Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: ${{ github.event.inputs.release_title || steps.prepare_artifacts.outputs.tag_name }}
          files: |
            release_dist/*.aab
            release_dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
